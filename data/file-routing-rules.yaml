# File Routing Rules — Seamless File Management
# Replaces n8n 22x22 tag-pair matrices with rules-based routing.
# Tag format: filename[Client Project Content].ext
# Tags are space-separated, hyphens for multi-word.

intake_path: "/intake"
gdrive_path: "/gdrive"

client_tags:
  - Lynn
  - Maya
  - Sulima
  - Daniela
  - Carolyn
  - Devon
  - Nicole
  - TDA
  - PRG

# Default content tag -> subfolder mapping (all clients inherit these)
default_content_routes:
  Admin: "Admin"
  PSD: "PSDs"
  OLD: "~old"
  Backup: "SHARED"
  Headshot: "Marketing/Headshots"
  Video: "Marketing/Video"
  Featured-image: "Marketing/Featured images"
  Social-image: "Marketing/Social images"
  Newsletter: "Marketing/Newsletter"
  B-Roll: "Marketing/Video"
  Asset: "Website/Assets"
  Copy: "Website/Copy"
  Design: "Website/Design"
  Source: "Source files"
  Inspo: "Source files"
  Marketing: "Marketing"

# Content tags that route to the book folder (need project tag)
default_book_content_tags:
  - Cover
  - Interior
  - Info

clients:
