{% extends "base.html" %}
{% block title %}Tasks — List{% endblock %}

{% block content %}
<div class="page-header">
  <h2>Task List</h2>
  <p class="description">Master Task List from ClickUp</p>
</div>

<div class="card">
  <form hx-post="/tasks/list/filter" hx-target="#task-results" hx-swap="innerHTML">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 1rem;">
      <div class="form-group">
        <label>Project</label>
        <select name="project">
          <option value="">All</option>
          {% for opt in project_options %}
          <option value="{{ opt.name }}" {% if filters.project == opt.name %}selected{% endif %}>{{ opt.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="">All active</option>
          {% for s in statuses %}
          <option value="{{ s }}" {% if filters.status == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Approach</label>
        <select name="approach">
          <option value="">All</option>
          {% for opt in approach_options %}
          <option value="{{ opt.name }}" {% if filters.approach == opt.name %}selected{% endif %}>{{ opt.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Revenue</label>
        <select name="revenue">
          <option value="">All</option>
          {% for opt in revenue_options %}
          <option value="{{ opt.name }}" {% if filters.revenue == opt.name %}selected{% endif %}>{{ opt.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Effort</label>
        <select name="effort">
          <option value="">All</option>
          {% for opt in effort_options %}
          <option value="{{ opt.name }}" {% if filters.effort == opt.name %}selected{% endif %}>{{ opt.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Scope</label>
        <select name="scope">
          <option value="">All</option>
          {% for opt in scope_options %}
          <option value="{{ opt.name }}" {% if filters.scope == opt.name %}selected{% endif %}>{{ opt.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Readiness</label>
        <select name="readiness">
          <option value="">All</option>
          {% for opt in readiness_options %}
          <option value="{{ opt.name }}" {% if filters.readiness == opt.name %}selected{% endif %}>{{ opt.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div style="display: flex; gap: 0.75rem; align-items: end; margin-bottom: 1rem;">
      <div class="form-group" style="flex: 1; margin-bottom: 0;">
        <label>Search</label>
        <input type="text" name="search" value="{{ filters.search }}" placeholder="Search task names...">
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label>Sort by</label>
        <select name="sort_by">
          <option value="due_date" {% if filters.sort_by == 'due_date' %}selected{% endif %}>Due Date</option>
          <option value="approach" {% if filters.sort_by == 'approach' %}selected{% endif %}>Approach (Dread first)</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label style="display: flex; align-items: center; gap: 0.375rem; cursor: pointer;">
          <input type="checkbox" name="overdue_only" value="true" {% if filters.overdue_only %}checked{% endif %}
                 style="width: auto; accent-color: var(--red);">
          Overdue only
        </label>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-bottom: 0;">
        Load Tasks
        <span class="htmx-indicator"><span class="spinner"></span></span>
      </button>
    </div>
  </form>
</div>

<div id="task-results">
  {% if loaded %}
  {% include "tasks/_task_list_partial.html" %}
  {% else %}
  <div class="empty-state">
    <div class="icon">&#9776;</div>
    <p>Set your filters and click Load Tasks to fetch from ClickUp.</p>
  </div>
  {% endif %}
</div>
{% endblock %}
